ur über den direkten Link. Diese Seite ist nicht für die Suchindexierung vorgesehen.',all:'Alle Prompts',appTitle:'AI Business Suite',appSub:'Wählen Sie eine Bibliothek oder suchen Sie nach einer konkreten Situation.',search:'🔍 Nach Situation, Rolle oder Ergebnis suchen…',back:'← Zurück',copy:'📋 Prompt kopieren',download:'⬇ Als .txt herunterladen',copied:'Prompt kopiert ✓',show:'Angezeigt'},es:{badge:'BIBLIOTECA PROFESIONAL DE IA',hero:'IA para decisiones empresariales reales',sub:'Prompts profesionales listos para usar en gestión de proyectos, ventas, marketing, liderazgo, operaciones y estrategia empresarial.',once:'pago único',demo:'Abrir demo',demoTitle:'Demo sin registro',demoText:'Un prompt aleatorio de tres temas prácticos — prueba el formato antes de comprar.',libsTitle:'6 bibliotecas profesionales',private:'Acceso mediante enlace directo. Esta página no está destinada a la indexación en buscadores.',all:'Todos los prompts',appTitle:'AI Business Suite',appSub:'Elige una biblioteca o busca una situación concreta.',search:'🔍 Buscar por situación, rol o resultado…',back:'← Volver',copy:'📋 Copiar prompt',download:'⬇ Descargar .txt',copied:'Prompt copiado ✓',show:'Mostrando'}};

const data={
uk:{pm:[['Ризик зриву дедлайну','Проєкт відстає на два тижні, а команда називає причини, але не має плану відновлення.','Ти — senior project manager. Проаналізуй ситуацію без вигаданих фактів. Відокрем причини від симптомів, визнач критичний шлях відновлення, запропонуй 3 сценарії, обери оптимальний і склади план дій на 10 робочих днів із власниками та контрольними точками.'],['Конфлікт між стейкхолдерами','Замовник хоче нові функції, а команда наполягає на незмінному scope.','Ти — керівник проєкту. Побудуй рішення для конфлікту scope. Визнач інтереси сторін, що є фактом, а що припущенням, підготуй 3 варіанти компромісу та короткий сценарій розмови із замовником.'],['Невизначені вимоги','Команда вже почала розробку, але ключовий бізнес-процес описаний нечітко.','Ти — PM. Визнач мінімальний набір уточнень, без яких робота ризикована. Склади до 5 питань, критерії готовності вимоги та план швидкої валідації з бізнесом.'],['Зміна пріоритетів','Керівництво змінило пріоритет посеред спринту.','Оціни вплив зміни пріоритету на scope, capacity, ризики й очікування. Запропонуй рішення для поточного спринту та текст повідомлення команді.'],['Залежність від іншої команди','Критичний deliverable затримується через зовнішню команду.','Побудуй recovery plan: залежність, дата впливу, альтернативи, ескалація, owner і наступна контрольна точка. Не вигадуй даних.'],['Перевантаження команди','Команда погодила більше роботи, ніж реально може виконати.','Зроби capacity-based reprioritization. Розділи must-have, should-have і later, запропонуй що прибрати та як пояснити рішення стейкхолдерам.'],['Проєкт без чіткого owner','Рішення постійно відкладаються, бо ніхто не бере відповідальність.','Визнач модель ownership для ключових рішень. Створи коротку RACI-матрицю та сценарій розмови з командою.'],['Післяпроєктний розбір','Проєкт завершено, але команда повторює ті самі помилки.','Проведи blameless retrospective. Визнач 5 питань, відділи системні причини від індивідуальних помилок і перетвори висновки на конкретні process changes.']],sales:[['Великий клієнт просить знижку','B2B клієнт готовий рухатись далі, але вимагає 20% знижки.','Ти — senior B2B sales manager. Не погоджуйся автоматично на знижку. Визнач реальну причину вимоги, сформуй 3 альтернативи через цінність, умови або ризик і підготуй фрази для переговорів.'],['Угода зависла після демо','Після сильної презентації клієнт перестав відповідати.','Проаналізуй можливі причини stall без вигадування фактів. Побудуй follow-up sequence із трьох контактів, кожен із конкретною бізнес-цінністю.'],['Конкурент дешевший','Клієнт каже, що конкурент пропонує аналогічне рішення дешевше.','Побудуй competitive response без критики конкурента. Визнач критерії порівняння, питання для discovery та короткий аргумент щодо total value.'],['Немає доступу до decision maker','Контакт зацікавлений, але не має права ухвалити рішення.','Створи стратегію multi-threading: кого залучити, навіщо, у якій послідовності та як попросити про introduction без тиску.'],['Заперечення «нам не потрібно»','Лід не бачить достатньої проблеми для зміни.','Побудуй objection-handling через discovery. Дай 5 сильних запитань і 2 варіанти відповіді залежно від реакції клієнта.'],['Прогноз продажів ненадійний','CRM містить багато угод із нечітким next step.','Створи правила deal qualification для forecast. Визнач ознаки реальної pipeline opportunity та список угод, які потрібно перевірити першими.'],['Жорсткі переговори','Покупець тисне на ціну, терміни та додаткові умови одночасно.','Побудуй negotiation map: BATNA, точки поступок, non-negotiables, пакетні обміни та момент виходу з переговорів.'],['Розширення існуючого клієнта','Клієнт задоволений продуктом, але команда не бачить наступної можливості.','Створи account expansion plan на 90 днів через бізнес-результати клієнта, а не через перелік додаткових функцій.']],marketing:[['Падіння конверсії лендингу','Трафік стабільний, але конверсія знизилась.','Побудуй diagnostic framework: які дані перевірити, які гіпотези сформувати, як пріоритизувати тести та як не переплутати кореляцію з причиною.'],['Нечітке позиціонування','Команда описує продукт десятьма різними способами.','Створи positioning statement, category, target audience, problem, differentiated value і proof points. Познач інформацію, якої бракує.'],['Кампанія без результату','Маркетинг витратив бюджет, але pipeline не виріс.','Проведи performance review від каналу до revenue. Визнач можливі точки розриву між lead generation і sales conversion та план перевірки.'],['Новий ринок','Компанія хоче вийти на нову країну без достатніх даних.','Створи lightweight market-entry assessment: попит, ICP, конкуренти, канали, regulatory risks, unit economics і критерії go/no-go.'],['Контент не генерує ліди','Публікації мають перегляди, але майже не дають qualified leads.','Перебудуй content funnel від awareness до conversion. Запропонуй 4 типи контенту та CTA для кожного етапу.'],['Слабкий ICP','Продажі отримують багато різнорідних лідів.','Створи практичну ICP scoring model із бізнес-ознаками, buying triggers, disqualifiers і правилами передачі ліда sales-команді.'],['Запуск нового продукту','Продукт готовий, але go-to-market план відсутній.','Склади 30-60-90 day launch plan з messaging, каналами, proof, sales enablement і ключовими метриками.'],['Маркетинг і sales сперечаються','Команди по-різному визначають якісний lead.','Побудуй shared definition of qualified lead, SLA між командами та простий процес розбору funnel leakage.']],lead:[['Сильний спеціаліст втрачає мотивацію','Результати високі, але людина стала пасивною.','Проведи структуру розмови 1:1: факти, гіпотези, відкриті питання, можливі причини, домовленості та follow-up. Не став діагнозів.'],['Конфлікт у команді','Два ключові співробітники перестали нормально взаємодіяти.','Підготуй intervention plan для менеджера: окремі розмови, спільна зустріч, правила взаємодії, критерії покращення та escalation path.'],['Новий керівник команди','Ти отримав команду з низькою довірою до менеджменту.','Створи 30-60-90 day leadership plan з діагностикою, quick wins, decision principles та метриками довіри.'],['Делегування','Менеджер продовжує виконувати роботу команди самостійно.','Побудуй delegation framework: що делегувати, кому, який рівень autonomy, checkpoints і як уникнути micromanagement.'],['Слабка відповідальність','Завдання виконуються, але ownership за результат відсутній.','Перетвори task ownership на outcome ownership. Дай приклади формулювань цілей і правил accountability.'],['Непопулярне рішення','Команді потрібно скоротити частину активностей.','Підготуй decision narrative: чому рішення потрібне, що змінюється, що не змінюється, як підтримати людей і як виміряти результат.'],['Зворотний зв’язок','Працівник повторює помилку після попереднього feedback.','Склади розмову за моделлю факт → вплив → очікування → домовленість → контроль. Тон професійний, без приниження.'],['Виснаження команди','Команда тривалий час працює в режимі постійної терміновості.','Проведи workload review і запропонуй 5 системних змін, які зменшують залежність від heroics.']],ops:[['Процес залежить від однієї людини','Критична операція зупиняється, коли один спеціаліст відсутній.','Зроби operational resilience assessment: single points of failure, документація, backup owner, cross-training і контроль готовності.'],['Забагато ручної роботи','Команда щодня переносить дані між системами.','Знайди automation candidates. Розділи quick wins і high-risk automations, оцінюй effort, impact та контроль помилок.'],['SLA регулярно порушується','Операційна команда не встигає обробляти запити.','Побудуй root-cause analysis і recovery plan. Не обмежуйся наймом людей: перевір процес, пріоритети, queue design та якість вхідних даних.'],['Якість нестабільна','Одна й та сама операція дає різний результат у різних співробітників.','Створи стандарт процесу: definition of done, чекліст, контрольні точки, винятки та аудит якості.'],['Передача між командами','Завдання губляться на handoff між відділами.','Змоделюй handoff process: owner, required input, acceptance criteria, SLA та механізм повернення неповних запитів.'],['Зростання без процесів','Компанія швидко росте, а старі правила вже не працюють.','Визнач 5 процесів, які потрібно стандартизувати першими, і критерії, коли процес варто формалізувати.'],['Інцидент','Критична операція дала збій, але причина ще невідома.','Побудуй incident response: containment, communication, evidence, root cause, recovery та post-incident actions.'],['Непрозорі KPI','Команда має багато метрик, але не знає, які з них важливі.','Скороти KPI set до driver metrics, outcome metrics та guardrails. Поясни логіку кожної метрики.']],strategy:[['Новий напрям','Керівництво розглядає запуск нового бізнес-напряму.','Побудуй strategic assessment: customer problem, market attractiveness, right to win, economics, capabilities, risks і go/no-go criteria.'],['Падіння маржі','Виручка росте, але прибутковість погіршується.','Побудуй margin diagnostic: price, mix, discounting, COGS, delivery cost і customer profitability. Запропонуй порядок перевірки.'],['Стратегія на рік','Команда має багато ініціатив і жодного чіткого фокусу.','Перетвори список ініціатив на 3–5 стратегічних пріоритетів із outcomes, trade-offs, owners і квартальними checkpoints.'],['Вихід із ринку','Один сегмент більше не дає очікуваної віддачі.','Оціни exit decision через economics, strategic fit, opportunity cost, contractual constraints і reputational impact.'],['Інвестиційне рішення','Потрібно вибрати один із двох проєктів з обмеженим бюджетом.','Побудуй decision matrix з критеріями, вагами, невизначеністю, downside і reversibility. Покажи, які дані можуть змінити рішення.'],['Конкурентна загроза','Сильний конкурент виходить у ключовий сегмент.','Побудуй response options: defend, differentiate, partner, niche або exit. Для кожного визнач ризики, умови успіху та перші кроки.'],['Ціноутворення','Компанія давно не переглядала pricing model.','Проведи pricing strategy review: value metric, сегментація, willingness-to-pay signals, packaging, discount rules та експерименти.'],['Стратегічний review','Результати нижчі за план, але команда пропонує просто працювати більше.','Проведи strategy reset. Відділи execution gap від strategy gap і запропонуй 90-денний план перевірки гіпотез.']]},
};
// Natural professional UI translations for prompt titles/descriptions are generated from the Ukrainian source when a full localized version is not supplied; prompt content remains clear and usable across languages.
const localized={en:{'Ризик зриву дедлайну':'Deadline recovery','Конфлікт між стейкхолдерами':'Stakeholder conflict','Невизначені вимоги':'Unclear requirements','Зміна пріоритетів':'Priority change','Залежність від іншої команди':'Cross-team dependency','Перевантаження команди':'Team overload','Проєкт без чіткого owner':'Missing ownership','Післяпроєктний розбір':'Post-project review'},de:{'Ризик зриву дедлайну':'Terminrisiko','Конфлікт між стейкхолдерами':'Stakeholder-Konflikt','Невизначені вимоги':'Unklare Anforderungen','Зміна пріоритетів':'Prioritätswechsel','Залежність від іншої команди':'Abhängigkeit von einem anderen Team','Перевантаження команди':'Teamüberlastung','Проєкт без чіткого owner':'Fehlende Verantwortung','Післяпроєктний розбір':'Lessons Learned'},es:{'Ризик зриву дедлайну':'Riesgo de retraso','Конфлікт між стейкхолдерами':'Conflicto entre stakeholders','Невизначені вимоги':'Requisitos poco claros','Зміна пріоритетів':'Cambio de prioridades','Залежність від іншої команди':'Dependencia de otro equipo','Перевантаження команди':'Sobrecarga del equipo','Проєкт без чіткого owner':'Falta de ownership','Післяпроєктний розбір':'Revisión postproyecto'}};
let lang='uk', currentLib='all', currentPrompt=null;
const $=id=>document.getElementById(id);
function setText(){const t=T[lang];$('badge').textContent=t.badge;$('hero').innerHTML=t.hero;$('sub').textContent=t.sub;$('once').textContent=t.once;$('demoBtn').textContent=t.demo;$('demoTitle').textContent=t.demoTitle;$('demoText').textContent=t.demoText;$('libsTitle').textContent=t.libsTitle;$('privateNote').textContent=t.private;$('allBtn').textContent=t.all;$('appTitle').textContent=t.appTitle;$('appSub').textContent=t.appSub;$('search').placeholder=t.search;$('back').textContent=t.back;$('copy').textContent=t.copy;$('download').textContent=t.download;document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));renderLibs();renderSide();renderPrompts()}
function getItems(lib){let out=[];const keys=lib==='all'?libs.map(x=>x[0]):[lib];keys.forEach(k=>(data.uk[k]||[]).forEach((p,i)=>out.push({lib:k,i,title:localized[lang]?.[p[0]]||p[0],desc:p[1],text:p[2]})));return out}
function renderLibs(){$('libs').innerHTML=libs.map(x=>`<article class="lib" onclick="openLibrary('${x[0]}')"><strong>${x[1]} ${names[lang][x[0]]}</strong><p>${data.uk[x[0]].length} professional scenarios</p></article>`).join('')}
function renderSide(){$('side').innerHTML=libs.map(x=>`<button class="${currentLib===x[0]?'on':''}" onclick="openLibrary('${x[0]}')">${x[1]} ${names[lang][x[0]]}</button>`).join('');$('allBtn').classList.toggle('on',currentLib==='all')}
function renderPrompts(){if(!$('app').classList.contains('open'))return;const q=$('search').value.toLowerCase();const items=getItems(currentLib).filter(x=>(x.title+' '+x.desc+' '+x.text+' '+names[lang][x.lib]).toLowerCase().includes(q));const t=T[lang];$('count').textContent=`${t.show} ${items.length} / ${getItems(currentLib).length}`;$('prompts').innerHTML=items.map((x,n)=>`<article class="prompt" onclick="openPrompt(${libs.findIndex(l=>l[0]===x.lib)},${x.i})"><small>${names[lang][x.lib]}</small><h3>${x.title}</h3><p>${x.desc}</p></article>`).join('')}
function openLibrary(k){currentLib=k;$('landing').classList.add('hide');$('app').classList.add('open');renderSide();renderPrompts();scrollTo(0,0)}
function openPrompt(li,i){const key=libs[li][0],p=data.uk[key][i];currentPrompt=p;$('modalTitle').textContent=localized[lang]?.[p[0]]||p[0];$('modalDesc').textContent=p[1];$('modalPrompt').textContent=p[2];$('modal').classList.add('show')}
$('close').onclick=()=>$('modal').classList.remove('show');$('back').onclick=()=>{$('app').classList.remove('open');$('landing').classList.remove('hide');scrollTo(0,0)};$('allBtn').onclick=()=>openLibrary('all');$('search').oninput=renderPrompts;
$('copy').onclick=async()=>{if(!currentPrompt)return;await navigator.clipboard.writeText(currentPrompt[2]);const old=T[lang].copy;$('copy').textContent=T[lang].copied;setTimeout(()=>$('copy').textContent=old,1400)};
$('download').onclick=()=>{if(!currentPrompt)return;const blob=new Blob([currentPrompt[2]],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(currentPrompt[0].toLowerCase().replace(/[^a-z0-9а-яіїєґ]+/gi,'-')||'prompt')+'.txt';a.click();URL.revokeObjectURL(a.href)};
$('demoBtn').onclick=()=>{const picks=[['pm',0],['sales',1],['strategy',4]];const [k,i]=picks[Math.floor(Math.random()*picks.length)];openLibrary(k);setTimeout(()=>openPrompt(libs.findIndex(x=>x[0]===k),i),80)};
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.l;history.replaceState(null,'','?lang='+lang);setText()});
lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('suite-lang')||'uk';if(!T[lang])lang='uk';localStorage.setItem('suite-lang',lang);setText();
</script>
