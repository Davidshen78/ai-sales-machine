;align-items:center;justify-content:center;padding:18px}.box{width:min(900px,100%);max-height:92vh;overflow:auto;background:#0a1727;border:1px solid var(--border);border-radius:20px;padding:26px}.close{float:right;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:9px;padding:7px 10px}.meta{color:var(--blue);font-weight:800;margin-top:6px}.box h2{margin:12px 0 16px}.prompt{white-space:pre-wrap;background:#050d17;border:1px solid var(--border);border-radius:14px;padding:18px;line-height:1.58;color:#dce7f2;font-size:14px}.copy{margin-top:14px;padding:12px 18px;border:0;border-radius:11px;background:var(--accent);color:#052017;font-weight:900}.footer{padding:30px 5%;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:13px}@media(max-width:850px){.nav{height:64px;padding:0 16px}.hero{padding:58px 20px 40px}h1{font-size:clamp(38px,11vw,56px);letter-spacing:-2px}.hero p{font-size:17px}.section{padding:18px 16px 55px}.grid{grid-template-columns:1fr;gap:12px}.card{padding:18px}.box{padding:18px;border-radius:16px}.prompt{font-size:13px;padding:15px}.cta{width:100%;min-height:50px}.lang{padding:7px 9px;font-size:12px}}

let lang='uk';const $=s=>document.querySelector(s);function render(){const t=T[lang];document.documentElement.lang=lang;$('#badge').textContent=t.badge;$('#title').textContent=t.title;$('#subtitle').textContent=t.subtitle;$('#demoBtn').textContent=t.cta;$('#note').textContent=t.note;$('#copyBtn').textContent=t.copy;$('#cards').innerHTML=t.cards.map((x,i)=>`<article class="card"><div class="num">0${i+1} · DEMO TOPIC</div><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});$('#demoBtn').onclick=()=>{const p=P[lang][Math.floor(Math.random()*3)];$('#meta').textContent='AI Sales Machine · Demo';$('#modalTitle').textContent=p[0];$('#promptText').textContent=p[1];$('#modal').style.display='flex'};$('#closeBtn').onclick=()=>$('#modal').style.display='none';$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').style.display='none'};$('#copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('#promptText').textContent);$('#copyBtn').textContent=T[lang].copied;setTimeout(()=>$('#copyBtn').textContent=T[lang].copy,1500)};render();
</script></body></html>
